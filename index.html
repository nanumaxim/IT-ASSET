<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบทะเบียนอุปกรณ์ไอที</title>
<style>
  body {
    font-family: "Tahoma", "Sarabun", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f5f5f5;
    color: #222;
  }

  h1 {
    font-size: 22px;
    margin-bottom: 20px;
  }

  h2 {
    font-size: 18px;
    margin-top: 30px;
  }

  form {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
  }

  .form-field label {
    font-size: 14px;
    margin-bottom: 4px;
    font-weight: bold;
  }

  .form-field input,
  .form-field select {
    padding: 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .form-actions {
    grid-column: 1 / -1;
  }

  button {
    padding: 10px 20px;
    font-size: 14px;
    background-color: #2563eb;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #1d4ed8;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background: #fff;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
    font-size: 14px;
  }

  th {
    background-color: #e5e7eb;
  }

  .empty-row td {
    text-align: center;
    color: #888;
    padding: 20px;
  }

  .filter-bar {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px;
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    flex: 1 1 180px;
  }

  .filter-field label {
    font-size: 14px;
    margin-bottom: 4px;
    font-weight: bold;
  }

  .filter-field input,
  .filter-field select {
    padding: 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .result-count {
    font-size: 14px;
    color: #555;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>ระบบทะเบียนอุปกรณ์ไอที</h1>

  <h2>เพิ่มอุปกรณ์ใหม่</h2>
  <form id="asset-form">
    <div class="form-field">
      <label for="asset-name">ชื่ออุปกรณ์</label>
      <input type="text" id="asset-name" placeholder="เช่น Dell Latitude 5420" required>
    </div>

    <div class="form-field">
      <label for="asset-type">ประเภท</label>
      <select id="asset-type" required>
        <option value="">-- เลือกประเภท --</option>
        <option value="โน้ตบุ๊ก">โน้ตบุ๊ก</option>
        <option value="จอ">จอ</option>
        <option value="เครื่องพิมพ์">เครื่องพิมพ์</option>
        <option value="สวิตช์">สวิตช์</option>
        <option value="กล้องวงจรปิด">กล้องวงจรปิด</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="form-field">
      <label for="asset-serial">หมายเลขเครื่อง</label>
      <input type="text" id="asset-serial" placeholder="เช่น SN-12345">
    </div>

    <div class="form-field">
      <label for="asset-owner">ผู้ถือครอง</label>
      <input type="text" id="asset-owner" placeholder="เช่น สมชาย ใจดี">
    </div>

    <div class="form-field">
      <label for="asset-status">สถานะ</label>
      <select id="asset-status" required>
        <option value="">-- เลือกสถานะ --</option>
        <option value="ใช้งาน">ใช้งาน</option>
        <option value="ซ่อม">ซ่อม</option>
        <option value="เลิกใช้">เลิกใช้</option>
        <option value="สำรอง">สำรอง</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" id="asset-form-submit-btn">บันทึก</button>
      <button type="button" id="asset-form-cancel-btn" style="display:none; background-color:#6b7280; margin-left:8px;">ยกเลิก</button>
    </div>
  </form>

  <h2>รายการอุปกรณ์ทั้งหมด</h2>

  <div class="filter-bar">
    <div class="filter-field">
      <label for="search-input">ค้นหา</label>
      <input type="text" id="search-input" placeholder="ค้นหาชื่ออุปกรณ์ / หมายเลขเครื่อง / ผู้ถือครอง">
    </div>

    <div class="filter-field">
      <label for="filter-type">กรองตามประเภท</label>
      <select id="filter-type">
        <option value="">-- ทั้งหมด --</option>
        <option value="โน้ตบุ๊ก">โน้ตบุ๊ก</option>
        <option value="จอ">จอ</option>
        <option value="เครื่องพิมพ์">เครื่องพิมพ์</option>
        <option value="สวิตช์">สวิตช์</option>
        <option value="กล้องวงจรปิด">กล้องวงจรปิด</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filter-status">กรองตามสถานะ</label>
      <select id="filter-status">
        <option value="">-- ทั้งหมด --</option>
        <option value="ใช้งาน">ใช้งาน</option>
        <option value="ซ่อม">ซ่อม</option>
        <option value="เลิกใช้">เลิกใช้</option>
        <option value="สำรอง">สำรอง</option>
      </select>
    </div>
  </div>

  <div class="result-count" id="result-count"></div>

  <table>
    <thead>
      <tr>
        <th>Asset ID</th>
        <th>ชื่ออุปกรณ์</th>
        <th>ประเภท</th>
        <th>หมายเลขเครื่อง</th>
        <th>ผู้ถือครอง</th>
        <th>สถานะ</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="asset-table-body">
    </tbody>
  </table>

<script>
  const STORAGE_KEY = "it-asset-registry";

  let assets = loadAssets();

  function loadAssets() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    try {
      return JSON.parse(raw);
    } catch (e) {
      return [];
    }
  }

  function saveAssets() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(assets));
  }

  function getFilteredAssets() {
    const keyword = document.getElementById("search-input").value.trim().toLowerCase();
    const typeFilter = document.getElementById("filter-type").value;
    const statusFilter = document.getElementById("filter-status").value;

    return assets.filter(function (asset) {
      const matchesKeyword =
        !keyword ||
        (asset.name || "").toLowerCase().includes(keyword) ||
        (asset.serial || "").toLowerCase().includes(keyword) ||
        (asset.owner || "").toLowerCase().includes(keyword);

      const matchesType = !typeFilter || asset.type === typeFilter;
      const matchesStatus = !statusFilter || asset.status === statusFilter;

      return matchesKeyword && matchesType && matchesStatus;
    });
  }

  function updateResultCount(filteredCount, totalCount) {
    const resultCount = document.getElementById("result-count");
    resultCount.textContent = "พบ " + filteredCount + " จาก " + totalCount + " รายการ";
  }

  function renderTable() {
    const tbody = document.getElementById("asset-table-body");
    tbody.innerHTML = "";

    const filteredAssets = getFilteredAssets();
    updateResultCount(filteredAssets.length, assets.length);

    if (assets.length === 0) {
      const emptyRow = document.createElement("tr");
      emptyRow.className = "empty-row";
      emptyRow.innerHTML = `<td colspan="7">ยังไม่มีข้อมูลอุปกรณ์</td>`;
      tbody.appendChild(emptyRow);
      return;
    }

    if (filteredAssets.length === 0) {
      const noResultRow = document.createElement("tr");
      noResultRow.className = "empty-row";
      noResultRow.innerHTML = `<td colspan="5">ไม่พบข้อมูลที่ตรงกับการค้นหา</td>`;
      tbody.appendChild(noResultRow);
      return;
    }

    filteredAssets.forEach(function (asset) {
      const row = document.createElement("tr");
      row.innerHTML =
        "<td>" + escapeHtml(asset.id) + "</td>" +
        "<td>" + escapeHtml(asset.name) + "</td>" +
        "<td>" + escapeHtml(asset.type) + "</td>" +
        "<td>" + escapeHtml(asset.serial) + "</td>" +
        "<td>" + escapeHtml(asset.owner) + "</td>" +
        "<td>" + escapeHtml(asset.status) + "</td>" +
        "<td></td>";

      const actionCell = row.lastElementChild;

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.title = "แก้ไข";
      editBtn.textContent = "✏️";
      editBtn.style.marginRight = "6px";
      editBtn.style.backgroundColor = "#eab308";
      editBtn.addEventListener("click", function () {
        startEditAsset(asset.id);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.title = "ลบ";
      deleteBtn.textContent = "🗑️";
      deleteBtn.style.backgroundColor = "#dc2626";
      deleteBtn.addEventListener("click", function () {
        deleteAsset(asset.id);
      });

      actionCell.appendChild(editBtn);
      actionCell.appendChild(deleteBtn);

      tbody.appendChild(row);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  let editingId = null;

  function startEditAsset(id) {
    const asset = assets.find(function (a) { return a.id === id; });
    if (!asset) return;

    editingId = id;

    document.getElementById("asset-name").value = asset.name;
    document.getElementById("asset-type").value = asset.type;
    document.getElementById("asset-serial").value = asset.serial;
    document.getElementById("asset-owner").value = asset.owner;
    document.getElementById("asset-status").value = asset.status;

    document.getElementById("asset-form-submit-btn").textContent = "บันทึกการแก้ไข";
    document.getElementById("asset-form-cancel-btn").style.display = "";

    document.getElementById("asset-form").scrollIntoView({ behavior: "smooth" });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById("asset-form").reset();
    document.getElementById("asset-form-submit-btn").textContent = "บันทึก";
    document.getElementById("asset-form-cancel-btn").style.display = "none";
  }

  function deleteAsset(id) {
    const asset = assets.find(function (a) { return a.id === id; });
    if (!asset) return;

    const confirmed = confirm("ยืนยันการลบอุปกรณ์ \"" + asset.name + "\" ใช่หรือไม่?");
    if (!confirmed) return;

    assets = assets.filter(function (a) { return a.id !== id; });
    saveAssets();

    if (editingId === id) {
      cancelEdit();
    }

    renderTable();
  }

  document.getElementById("asset-form-cancel-btn").addEventListener("click", cancelEdit);

  document.getElementById("asset-form").addEventListener("submit", function (event) {
    event.preventDefault();

    const name = document.getElementById("asset-name").value.trim();
    const type = document.getElementById("asset-type").value;
    const serial = document.getElementById("asset-serial").value.trim();
    const owner = document.getElementById("asset-owner").value.trim();
    const status = document.getElementById("asset-status").value;

    if (!name || !type || !status) {
      alert("กรุณากรอกชื่ออุปกรณ์ ประเภท และสถานะให้ครบ");
      return;
    }

    if (editingId) {
      const asset = assets.find(function (a) { return a.id === editingId; });
      if (asset) {
        asset.name = name;
        asset.type = type;
        asset.serial = serial;
        asset.owner = owner;
        asset.status = status;
        asset.updatedAt = new Date().toISOString();
      }
      saveAssets();
      renderTable();
      cancelEdit();
      return;
    }

    const newAsset = {
      id: "asset-" + Date.now(),
      name: name,
      type: type,
      serial: serial,
      owner: owner,
      status: status,
      updatedAt: new Date().toISOString()
    };

    assets.push(newAsset);
    saveAssets();
    renderTable();
    event.target.reset();
  });

  document.getElementById("search-input").addEventListener("input", renderTable);
  document.getElementById("filter-type").addEventListener("change", renderTable);
  document.getElementById("filter-status").addEventListener("change", renderTable);

  renderTable();
</script>

</body>
</html>
